version: '3.8'

services:
  docker-eks-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-eks-demo
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
