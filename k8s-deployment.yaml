apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-eks-demo
  labels:
    app: docker-eks-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker-eks-demo
  template:
    metadata:
      labels:
        app: docker-eks-demo
    spec:
      containers:
      - name: docker-eks-demo
        image: docker-eks-demo:1.0.0
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: JAVA_OPTS
          value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"

---
apiVersion: v1
kind: Service
metadata:
  name: docker-eks-demo-service
  labels:
    app: docker-eks-demo
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: docker-eks-demo
